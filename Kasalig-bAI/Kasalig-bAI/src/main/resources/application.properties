spring.application.name=Kasalig-bAI

spring.datasource.url=jdbc:mysql://localhost:3306/kasalig_bai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Error responses are JSON with a "message" the frontend shows to the user (e.g. "Incorrect
# email or password."), and never a stack trace. Spring Boot 4 renamed these from server.error.*.
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# JWT login tokens. Set JWT_SECRET (at least 32 characters) outside development; the fallback
# below is only for running locally. Anyone who knows the secret can forge a login.
app.jwt.secret=${JWT_SECRET:kasalig-bai-local-dev-secret-change-me-0123456789}
# How long a login lasts. When it runs out the frontend logs the user out and sends them to
# the login page, so keep this long enough for a study session (it was 1m, which signed
# everyone out one minute after logging in).
app.jwt.expiration=8h

# The frontend address allowed to call the API from the browser.
app.cors.allowed-origins=http://localhost:5173
