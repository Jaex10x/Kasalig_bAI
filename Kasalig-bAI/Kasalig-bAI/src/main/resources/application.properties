spring.application.name=Kasalig-bAI

spring.datasource.url=jdbc:mysql://localhost:3306/kasalig_bai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Error responses are JSON with a "message" the frontend shows to the user (e.g. "Incorrect
# email or password."), and never a stack trace. Spring Boot 4 renamed these from server.error.*.
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never